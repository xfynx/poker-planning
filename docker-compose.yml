name: pokerplanning

services:
  redis:
    restart: unless-stopped
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    restart: unless-stopped
    build:
      context: ./backend
      target: dev
      secrets:
        - npm_ca
    environment:
      - NODE_ENV=development
      - PORT=3000
      - REDIS_URL=redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev
    profiles: ["dev"]

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      target: dev
      secrets:
        - npm_ca
    environment:
      - VITE_PROXY_TARGET=http://backend:3000
    ports:
      - "80:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173
    profiles: ["dev"]

  backend_prod:
    restart: unless-stopped
    build:
      context: ./backend
      target: prod
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_URL=redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["prod"]

  frontend_prod:
    restart: unless-stopped
    build:
      context: ./frontend
    environment:
      - NGINX_PORT=80
    ports:
      - "80:80"
    depends_on:
      - backend_prod
    profiles: ["prod"]

volumes:
  redis_data:

secrets:
  npm_ca:
    file: ${NPM_CA_FILE:-~/.secrets/kaspersky-ca.pem}

